[package]
name = "vellis"
version = "0.1.23"
description = "A read-only Markdown viewer for AI-generated documents"
authors = ["FirstFourNotes"]
edition = "2021"

[lib]
name = "vellis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "rt", "macros", "net", "io-util", "time"] }
async-trait = "0.1"
notify = "7"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
http = "1"
tauri-plugin-dialog = "2.7.0"
# Update notification (要件#14): the only outbound HTTP in the app — one GET
# to the GitHub releases API. `rustls` is reqwest's default TLS in 0.13 and
# rides on the aws-lc-rs already pulled in by russh; the JSON is parsed with
# the serde_json we already depend on, so no `json` feature.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# SSH Provider (Phase 2 P2.1) — optional dependencies
russh = { version = "0.54", optional = true }
russh-sftp = { version = "2.1", optional = true }
bytes = { version = "1", optional = true }
# `dirs` is now also used by the (always-on) `cli_fix` module.
dirs = "6"
ulid = { version = "1.2.1", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
strsim = "0.11.1"
sha2 = "0.11.0"
similar = "3.1.0"
toml = "1.1.2"

# E2E test harness — exposes a W3C WebDriver server inside the running app
# so external clients (WebdriverIO / Selenium) can drive the Webview.
# Compiled in only when the `webdriver` feature is enabled, and the plugin
# is also gated on `debug_assertions` at the call site so it cannot
# accidentally ship in a `cargo build --release --features webdriver`.
# Upstream: https://github.com/Choochmeque/tauri-plugin-webdriver
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-window-state = "2"

[features]
default = ["provider-ssh"]
provider-ssh = [
    "dep:russh",
    "dep:russh-sftp",
    "dep:bytes",
]
webdriver = ["dep:tauri-plugin-webdriver"]
# In-development features live behind this (default OFF). The tag-driven
# release `build:macos` job never passes it, so dev code is structurally
# absent from signed releases (feature-flags.md §3.3 layer 1). Local
# `pnpm dev:flags` / manual CI enable it.
dev-features = []

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

